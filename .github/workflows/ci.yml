name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inspircd netcat-openbsd openssl
          sudo systemctl stop inspircd.service

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Set up TLS test certificates
        run: bin/setup-tests

      - name: Start InspIRCd fixture
        run: |
          if (echo >/dev/tcp/127.0.0.1/6667) >/dev/null 2>&1; then
            echo "InspIRCd port 6667 is already occupied" >&2
            exit 1
          fi

          cat >/tmp/ircxd-ci.conf <<'EOF'
          <server name="irc.local"
                  description="ircxd CI"
                  network="Localnet">

          <admin name="ircxd"
                 nick="ircxd"
                 email="ircxd@localhost">

          <module name="cap">
          <module name="ircv3">
          <module name="ircv3_servertime">
          <module name="ircv3_msgid">
          <module name="ircv3_echomessage">
          <module name="ircv3_labeledresponse">

          <bind address="127.0.0.1" port="6667" type="clients">

          <connect allow="*"
                   timeout="60"
                   threshold="1000"
                   pingfreq="120"
                   hardsendq="262144"
                   softsendq="8192"
                   recvq="8192"
                   localmax="20"
                   globalmax="20"
                   maxchans="20">

          <files motd="/etc/inspircd/inspircd.motd">
          <dns server="127.0.0.1" timeout="5">

          <options syntaxhints="no"
                   announcets="yes"
                   hostintopic="yes"
                   pingwarning="15"
                   splitwhois="no"
                   exemptchanops="">

          <security hideserver=""
                    userstats="Pu"
                    customversion=""
                    flatlinks="no"
                    hidesplits="no"
                    hidebans="no"
                    maxtargets="20">

          <performance quietbursts="yes"
                       softlimit="1024"
                       somaxconn="128"
                       netbuffersize="10240">

          <whowas groupsize="10"
                  maxgroups="100000"
                  maxkeep="3d">
          EOF

          sudo cp /tmp/ircxd-ci.conf /etc/inspircd/ircxd-ci.conf
          sudo chown irc:irc /etc/inspircd/ircxd-ci.conf
          sudo -u irc inspircd --config /etc/inspircd/ircxd-ci.conf --debug --nolog --nopid --nofork >/tmp/ircxd-ci.log 2>&1 &
          inspircd_pid=$!

          for _ in {1..50}; do
            if ! kill -0 "${inspircd_pid}" 2>/dev/null; then
              echo "InspIRCd exited during startup" >&2
              tail -100 /tmp/ircxd-ci.log >&2 || true
              exit 1
            fi

            if (echo >/dev/tcp/127.0.0.1/6667) >/dev/null 2>&1; then
              cap_response=$(printf 'CAP LS 302\r\nQUIT :CI readiness check\r\n' | timeout 2 nc 127.0.0.1 6667 || true)
              capabilities_ready=true

              for capability in extended-join server-time echo-message standard-replies account-notify away-notify; do
                if [[ "${cap_response}" != *"${capability}"* ]]; then
                  capabilities_ready=false
                  break
                fi
              done

              if [[ "${capabilities_ready}" == true ]]; then
                exit 0
              fi
            fi
            sleep 0.1
          done

          echo "InspIRCd did not start with the required IRCv3 capabilities" >&2
          tail -100 /tmp/ircxd-ci.log >&2 || true
          exit 1

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run tests with coverage gate
        run: mix cover

      - name: Run performance benchmarks
        run: mix bench
