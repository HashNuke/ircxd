<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">ircxd — Elixir IRC client and embeddable server</title>
  <desc id="description">A brutalist terminal window showing an IRC connection and welcome message.</desc>
  <rect width="1200" height="400" fill="#0a0a0a"/>
  <rect x="24" y="24" width="1152" height="352" fill="#111111" stroke="#e8ff45" stroke-width="4"/>
  <rect x="24" y="24" width="1152" height="48" fill="#e8ff45"/>
  <g fill="#0a0a0a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">
    <text x="48" y="56">IRCXD://TERMINAL</text>
    <text x="1110" y="56">_ □ ×</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="128" fill="#ff6b35" font-size="24" font-weight="700">&gt; CONNECT ircxd</text>
    <text x="56" y="174" fill="#a7f3d0" font-size="22">CAP LS 302  :message-tags server-time batch sasl</text>
    <text x="56" y="216" fill="#a7f3d0" font-size="22">CAP ACK     :client + server</text>
    <text x="56" y="270" fill="#f5f5e9" font-size="38" font-weight="700">001  WELCOME TO IRCXD</text>
    <text x="56" y="316" fill="#c8c8bd" font-size="22">Elixir IRC client library + embeddable IRC server</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">
    <rect x="56" y="338" width="100" height="26" fill="#e8ff45"/>
    <text x="67" y="357" fill="#0a0a0a">ELIXIR</text>
    <rect x="168" y="338" width="100" height="26" fill="#ff6b35"/>
    <text x="180" y="357" fill="#0a0a0a">IRCV3</text>
    <rect x="280" y="338" width="184" height="26" fill="#a7f3d0"/>
    <text x="292" y="357" fill="#0a0a0a">CLIENT + SERVER</text>
  </g>
</svg>
